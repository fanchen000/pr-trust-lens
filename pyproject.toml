[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-trust-lens"
version = "0.3.0"
description = "Explainable trust-boundary checks for AI coding agents in GitHub Actions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "PR Trust Lens contributors"}]
keywords = ["github-actions", "security", "coding-agents", "prompt-injection"]
dependencies = ["PyYAML>=6.0,<7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
pr-trust-lens = "pr_trust_lens.cli:main"

[tool.setuptools.packages.find]
include = ["pr_trust_lens*"]

